services:
  yoobu-notifier:
    build: .
    container_name: yoobu-notifier
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      RUST_LOG: ${RUST_LOG:-yoobu_notifier=info}
    networks:
      - yoobu-net

networks:
  yoobu-net:
    external: true
